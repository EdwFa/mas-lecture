<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>Слайд 1. Агент — это …</title>
  <style>
    html, body {
      margin: 0;
      width: 1920px;
      height: 1080px;
      background: #f3efe6;
    }

    .slide {
      width: 1920px;
      height: 1080px;
      box-sizing: border-box;
      padding: 72px 96px 64px;
      display: flex;
      flex-direction: column;
      background: #f7f4ee;
      color: #1c1915;
      font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    }

    .kicker {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5e6872;
    }

    h1 {
      margin: 220px 0 0;
      font-size: 132px;
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .line {
      margin-top: 72px;
      width: 920px;
      border-top: 2px solid #1c1915;
    }

    .spacer {
      flex: 1;
    }

    footer {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-top: 1px solid #d9d3c7;
      padding-top: 28px;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 24px;
      line-height: 1.4;
      color: #3e4650;
    }
  </style>
</head>
<body>
  <main class="slide">
    <div class="kicker">
      <span>Лекция 1. Вводная</span>
      <span>01</span>
    </div>
    <h1>Агент — это&nbsp;…</h1>
    <div class="line"></div>
    <div class="spacer"></div>
    <footer>
      <span>Программная инженерия мультиагентных систем<br>в клинической медицине</span>
      <span>осень 2026</span>
    </footer>
  </main>
<script src="deck.js?v=11"></script>
</body>
</html>
