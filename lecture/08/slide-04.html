    <h1>Простой, продвинутый, модульный</h1>
    <svg class="ill" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1744 302" width="1744" height="302" style="display:block;margin-top:28px;overflow:visible;"><defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L11 6L1 11" fill="none" stroke="#1c1915" stroke-width="1.6"/></marker><marker id="ahg" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1L11 6L1 11" fill="none" stroke="#5e6872" stroke-width="1.6"/></marker><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="10" height="10" fill="#f7f4ee"/><line x1="0" y1="0" x2="0" y2="10" stroke="#ddd5c6" stroke-width="3"/></pattern></defs><rect x="0" y="0" width="900" height="300" rx="0" fill="#f7f4ee" stroke="#1c1915" stroke-width="1.4" opacity="1"/><text x="24" y="40" font-family="Georgia, Iowan Old Style, serif" font-size="26" text-anchor="start" fill="#1c1915" font-weight="400">Модульный</text><text x="24" y="70" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#5e6872" font-weight="400">+ оркестрация: развилки, циклы, слияние</text><rect x="40" y="90" width="820" height="190" rx="0" fill="#f3efe6" stroke="#1c1915" stroke-width="1.4" opacity="1"/><text x="64" y="128" font-family="Georgia, Iowan Old Style, serif" font-size="24" text-anchor="start" fill="#1c1915" font-weight="400">Продвинутый</text><text x="64" y="156" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#5e6872" font-weight="400">+ обработка до и после поиска</text><rect x="80" y="176" width="740" height="86" rx="0" fill="#ece6da" stroke="#1c1915" stroke-width="1.4" opacity="1"/><text x="104" y="214" font-family="Georgia, Iowan Old Style, serif" font-size="22" text-anchor="start" fill="#1c1915" font-weight="400">Простой (лекция 7)</text><text x="104" y="242" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="18" text-anchor="start" fill="#5e6872" font-weight="400">индекс → поиск → генерация</text><text x="960" y="60" font-family="Georgia, Iowan Old Style, serif" font-size="24" text-anchor="start" fill="#1c1915" font-weight="400">Каждый следующий — частный случай</text><text x="960" y="96" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#5e6872" font-weight="400">более общего. Простой RAG — это модульный,</text><text x="960" y="126" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#5e6872" font-weight="400">в котором модули «до» и «после» пустые.</text><text x="960" y="190" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#5e6872" font-weight="400">Поэтому начинают с простого и добавляют</text><text x="960" y="220" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#5e6872" font-weight="400">модуль только там, где измерение показало</text><text x="960" y="250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="19" text-anchor="start" fill="#5e6872" font-weight="400">сбой именно этого модуля.</text></svg><p class="coda">Правило инженера: модуль добавляют, когда измерение показало сбой именно в нём. Каждый модуль — это задержка, цена и новая точка отказа.</p>
